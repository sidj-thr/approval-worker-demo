name: Count Pending Approvals

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  count-reviews:
    name: Count pending reviews
    runs-on: ubuntu-latest
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.comment.body == 'pending_reviews' &&
        github.event.issue.pull_request != null
      ) || (
        github.event_name == 'pull_request' &&
        (github.event.action == 'labeled' || github.event.action == 'synchronize') &&
        contains(github.event.pull_request.labels.*.name, 'verify')
      )
    continue-on-error: true
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Count pending reviews
        uses: sidj-thr/oss-actions/count-pending-reviews@feat/QVAC-13860-review-count-js-action
        with:
          pat-token: ${{ secrets.PAT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          maintainers-github-team: qvac-mgmt
          team-leads-github-team: qvac-internal-merge
          total-required-approvals: 2
