name: Count Pending Approvals

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  count-reviews:
    name: Count Pending Approvals
    runs-on: ubuntu-latest
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.comment.body == 'pending_reviews' &&
        github.event.issue.pull_request != null
      ) || (
        github.event_name == 'pull_request_target' &&
        (github.event.action == 'labeled' || github.event.action == 'synchronize') &&
        contains(github.event.pull_request.labels.*.name, 'verify')
      )
    continue-on-error: true
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Count pending reviews
        uses: ./.github/actions/pending-reviews
        with:
          app-id:      ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          pr-number:   ${{ github.event.pull_request.number || github.event.issue.number }}
          maintainers-github-team: qvac-mgmt
          team-leads-github-team:  qvac-internal-merge
          total-required-approvals: 2
